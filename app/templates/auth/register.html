{% extends "base.html" %}
{% block title %}REGISTER{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="panel">
        <div class="panel-header"><span class="panel-title">Create Account</span></div>
        <div class="panel-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="user@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Min 8 characters" required minlength="8">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Register</button>
            </form>
            <p style="margin-top:12px;text-align:center;">
                <a href="{{ url_for('auth.login') }}" class="auth-link">&larr; Already have an account?</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
